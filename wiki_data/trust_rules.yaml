# User-curated trust rules for secure-llm-wiki.
#
# Rules are matched top-to-bottom against the source URI; first match wins.
# These rules are prepended before the built-in defaults, so they can override
# or tighten them.
#
# Built-in defaults (always active unless overridden):
#   trusted:      attack.mitre.org, atlas.mitre.org, nvd.nist.gov,
#                 cve.mitre.org, owasp.org
#   semi-trusted: arxiv.org, github.com, stackoverflow.com
#   (everything else defaults to untrusted)
#
# Levels: trusted | semi-trusted | untrusted
#
# Examples:
#   rules:
#     - pattern: "internal\.corp\.example\.com"
#       level: trusted
#       comment: "Internal knowledge base"
#     - pattern: "reddit\.com"
#       level: untrusted
#       comment: "Explicitly untrusted"

rules: []
