[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "secure-llm-wiki"
version = "0.1.0"
description = "Ein persistentes, gegen Prompt Injection gehärtetes LLM-Wiki"
requires-python = ">=3.10"
dependencies = [
    "anthropic>=0.40.0",
    "ollama>=0.4.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
